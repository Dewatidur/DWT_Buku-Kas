html:root:root:root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#333;--line:#999;--soft:#eee;--good:#14532d;--bad:#991b1b;color-scheme:light;padding:0}

<body>
<header class="top"><div class="wrap">
<div class="brand"><b>Buku Kas</b><span id="co"></span></div>
<div class="row"><div class="status" id="st"><i></i><span>Tersimpan di perangkat ini</span></div><select id="bk" aria-label="Buku kas" style="width:auto;padding:3px 8px;font-size:12.5px"></select><button class="btn sm" id="tm" data-act="theme" type="button"></button></div>
<nav class="tabs" aria-label="Menu"><a href="#dasbor">Dasbor</a><a href="#transaksi">Transaksi</a><a href="#laporan">Laporan</a><a href="#pengaturan">Pengaturan</a></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="sheet" hidden data-act="bg"></div>
<div id="toast" hidden></div>
<script>
const KEY='buku-kas.v1',MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DEF=()=>({cfg:{name:'Usaha Saya',theme:'auto',books:[{id:'b1',name:'Kas Tunai',opening:0}],cats:['Penjualan','Piutang diterima','Modal','Pembelian','Gaji','Sewa','Listrik dan air','Transportasi','Pemasaran','Lain-lain']},tx:[]});
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('id-ID'),pad=n=>String(n).padStart(2,'0');
const rp=n=>(n<0?'-':'')+'Rp '+nf.format(Math.abs(Math.round(n)));
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date());
const fd=s=>{const[y,m,d]=s.split('-');return d+' '+MON[+m-1]+' '+y};
const digits=s=>String(s||'').replace(/\D/g,''),sum=(a,k)=>a.reduce((x,t)=>x+t[k],0);
const short=n=>n>=1e9?(n/1e9).toFixed(1).replace('.0','')+' M':n>=1e6?(n/1e6).toFixed(1).replace('.0','')+' jt':n>=1e3?Math.round(n/1e3)+' rb':String(n);
let S,UI={sel:new Set(),book:'all',per:'bulan',pm:today().slice(0,7),py:today().slice(0,4),dr:{from:'',to:''},f:{q:'',cat:'',tp:'',from:'',to:'',lim:100},r:{mode:'bulan',day:today(),month:today().slice(0,7),year:today().slice(0,4)}};
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.cfg&&Array.isArray(o.tx))return norm(o)}}catch(e){}return DEF()}
function save(){const s=$('#st');try{localStorage.setItem(KEY,JSON.stringify(S));s.className='status';s.lastChild.textContent='Tersimpan di perangkat ini'}catch(e){s.className='status err';s.lastChild.textContent='Penyimpanan tidak tersedia, cadangkan data'}}
function ledger(){const ids=bookSel().map(b=>b.id);let b=openBal();return S.tx.filter(t=>ids.includes(t.book)).sort((x,y)=>x.date.localeCompare(y.date)||x.ts-y.ts).map(t=>{b+=t.in-t.out;return{...t,bal:b}})}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}
const isDark=()=>{const t=S.cfg.theme;return t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)};
function theme(){const t=S.cfg.theme;t==='light'||t==='dark'?document.documentElement.dataset.theme=t:delete document.documentElement.dataset.theme;const b=$('#tm');if(b)b.textContent=isDark()?'Mode terang':'Mode gelap'}
const tab=()=>{const h=location.hash.slice(1);return['dasbor','transaksi','laporan','pengaturan'].includes(h)?h:'dasbor'};

function render(){
  const t=tab();document.querySelectorAll('.tabs a').forEach(a=>a.getAttribute('href')==='#'+t?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  $('#co').textContent=S.cfg.name;fillBk();document.title='Buku Kas - '+S.cfg.name;
  $('#app').innerHTML=t==='dasbor'?vDash():t==='transaksi'?vTx():t==='laporan'?vLap():vSet();
  if(t==='transaksi')drawTable();
}
function vDashOld(){
  const L=ledger(),T=today(),p=UI.per,bal=L.length?L[L.length-1].bal:openBal();
  const P=L.filter(t=>p==='semua'||t.date.startsWith(p==='bulan'?T.slice(0,7):T.slice(0,4)));
  const si=sum(P,'in'),so=sum(P,'out');
  const bks=(UI.book==='all'&&S.cfg.books.length>1)?`<section class="sec"><h3>Saldo per buku kas</h3><div class="kpis">${S.cfg.books.map(b=>{const v=(+b.opening||0)+S.tx.filter(t=>t.book===b.id).reduce((a,t)=>a+t.in-t.out,0);return `<div class="kpi" style="background:none;color:inherit"><dt>${esc(b.name)}</dt><dd class="${v<0?'neg':''}">${rp(v)}</dd></div>`}).join('')}</div></section>`:'';

    case 'sel-clear':UI.sel.clear();drawTable();break;
    case 'ask-del-sel':{const n=UI.sel.size;if(!n){toast('Belum ada transaksi yang dicentang.');break}
      const sel=S.tx.filter(t=>UI.sel.has(t.id));
      openSheet(`<h2>Hapus ${n} transaksi terpilih?</h2><p>Total uang masuk ${rp(sum(sel,'in'))} dan uang keluar ${rp(sum(sel,'out'))} akan dihapus permanen dan tidak bisa dikembalikan.</p><div class="row"><button class="btn danger" data-act="do-del-sel">Hapus ${n} transaksi</button><button class="btn" data-act="close">Batal</button></div>`);break}
    case 'do-del-sel':{const n=UI.sel.size;S.tx=S.tx.filter(x=>!UI.sel.has(x.id));UI.sel.clear();save();closeSheet();render();toast(n+' transaksi dihapus.');break}
    case 'copy-tx':copyBox('Salin untuk Excel','c-tx',tsv(),'Salin teks di bawah, lalu tempel (Ctrl+V) di sel A1 Excel atau Google Sheets.');break;
    case 'copy':copyFrom(id);break;
    case 'backup':(async()=>{await ensureDL();await saveFile('buku-kas-cadangan-'+today()+'.json',JSON.stringify(S))})();break;
    case 'restore':openSheet(`<h2>Pulihkan dari cadangan</h2><p class="muted sm">Pilih file cadangan (.json) atau tempel teks cadangan. Data saat ini akan diganti.</p><input type="file" id="r-file" accept=".json,application/json,text/plain"><textarea id="r-in" rows="8"></textarea><div id="e"></div><div class="row"><button class="btn primary" data-act="do-restore">Pulihkan</button><button class="btn" data-act="close">Batal</button></div>`);break;
    case 'do-restore':try{const o=JSON.parse($('#r-in').value);if(!o||!o.cfg||!Array.isArray(o.tx))throw 0;S=norm({cfg:{...DEF().cfg,...o.cfg},tx:o.tx});UI.sel.clear();save();theme();closeSheet();render();toast('Data dipulihkan.')}catch(_){$('#e').innerHTML='<div class="err">Teks cadangan tidak dikenali. Pastikan seluruh teks tertempel.</div>'}break;
    case 'ask-wipe':{if(!S.tx.length){toast('Belum ada transaksi untuk dihapus.');break}
      openSheet(`<h2>Hapus semua transaksi?</h2><p><b>${S.tx.length}</b> transaksi akan dihapus permanen dan tidak bisa dikembalikan. Nama usaha, buku kas, saldo awal, dan kategori tetap tersimpan.</p><p class="muted sm">Sebaiknya cadangkan data dulu (Pengaturan, Cadangkan data) atau Ekspor Excel.</p><label class="f">Ketik HAPUS untuk melanjutkan<input id="wipe-in" autocomplete="off" autocapitalize="characters" placeholder="HAPUS"></label><div id="e"></div><div class="row"><button class="btn danger" data-act="do-wipe">Hapus semua</button><button class="btn" data-act="close">Batal</button></div>`);break}
    case 'do-wipe':{if(($('#wipe-in').value||'').trim().toUpperCase()!=='HAPUS'){$('#e').innerHTML='<div class="err">Ketik kata HAPUS terlebih dahulu.</div>';break}S.tx=[];UI.sel.clear();save();closeSheet();render();toast('Semua transaksi dihapus.');break}
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='tx')saveTx(f);
  else if(f.id==='set'){
    S.cfg.name=$('#s-co').value.trim()||'Usaha Saya';const bk=[...document.querySelectorAll('.bkr')].map(r=>({id:r.dataset.id,name:$('.bk-n',r).value.trim()||(S.cfg.books.find(x=>x.id===r.dataset.id)||{}).name||'',opening:+digits($('.bk-o',r).value)||0})).filter(b=>b.name);
    if(!bk.length){toast('Isi nama minimal satu buku kas.');return}
    S.cfg.books=bk;if(UI.book!=='all'&&!bk.some(b=>b.id===UI.book))UI.book='all';S.cfg.theme=$('#s-th').value;
    const cats=[...new Set($('#s-cat').value.split('\n').map(x=>x.trim()).filter(Boolean))];S.cfg.cats=cats;
    save();theme();render();toast('Pengaturan tersimpan.');
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList.contains('money')){const d=digits(el.value);el.value=d?nf.format(+d):''}
  if(el.closest&&el.closest('.ln'))updNew();
  if(el.id==='f-inv'){el.dataset.manual=el.value.trim()?'1':'0';if(el.dataset.manual==='0')updNo()}
  if(el.id==='f-in'||el.id==='f-out')updNo();
  if(el.dataset.dy){UI.py=el.value;render();return}
  if(el.dataset.dm){UI.pm=$('[data-dm=y]').value+'-'+pad($('[data-dm=m]').value);render();return}
  if(el.dataset.rm){const y=($('[data-rm=y]').value||'').slice(0,4);if(y.length===4){UI.r.month=y+'-'+pad($('[data-rm=m]').value);drawRpt()}}
  if(el.dataset.f){UI.f[el.dataset.f]=el.value;UI.f.lim=100;drawTable()}
  if(el.dataset.r){UI.r[el.dataset.r]=el.value;drawRpt()}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='sel-all'){const L=filtered();el.checked?L.forEach(t=>UI.sel.add(t.id)):UI.sel.clear();drawTable();return}
  if(el.dataset.sel){el.checked?UI.sel.add(el.dataset.sel):UI.sel.delete(el.dataset.sel);const tr=el.closest('tr');tr&&tr.classList.toggle('sel',el.checked);const bar=$('#selbar');if(bar)bar.innerHTML=selBar(filtered());return}
  if(el.id==='bk'){UI.book=el.value;render();return}if(el.id==='imp-f'){readImport(el.files[0]);return}if(el.id==='imp-dup'){impBtn();return}if(el.id==='r-file'){const f=el.files[0];if(f){const rd=new FileReader();rd.onload=()=>{$('#r-in').value=rd.result};rd.readAsText(f)}return}if(el.dataset.f&&el.tagName==='SELECT'){UI.f[el.dataset.f]=el.value;drawTable()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('.ln')){e.preventDefault();const ln=e.target.closest('.ln'),cls=[...e.target.classList].find(c=>c.startsWith('l-'));let nx=ln.nextElementSibling;if(!nx){$('#lns').insertAdjacentHTML('beforeend',lnHtml());renum();updNew();const L=lines();nx=L[L.length-1]}const t=cls&&nx.querySelector('.'+cls);t&&t.focus();return}
  if(e.key==='Escape'){if(DP){dpClose();return}if(!$('#sheet').hidden)closeSheet()}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('dp')){e.preventDefault();DP&&DP.el===e.target?dpClose():dpOpen(e.target)}});
window.addEventListener('scroll',()=>{if(DP)dpClose()},true);window.addEventListener('resize',()=>{if(DP)dpClose()});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
S=load();theme();render();save();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{window.claude&&claude.use&&claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
</script>
</body></html>
